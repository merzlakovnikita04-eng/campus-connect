<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3c72">
  <title>Campus Connect — Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="logo">
      <span class="logo-main">Campus Connect</span>
      <span class="logo-sub">КГП</span>
    </div>
    <p class="subtitle">Вход по студенческому</p>

    <form id="login-form">
      <label for="student-id">Номер студенческого</label>
      <input type="text" id="student-id" placeholder="СТ-2026-001" required autocomplete="username">

      <label for="student-password">🔐 Пароль</label>
      <input type="password" id="student-password" placeholder="Введите пароль" required autocomplete="current-password">

      <button type="submit">Войти</button>
      <p id="login-error" class="error"></p>
    </form>

    <div class="divider"><span>или</span></div>

    <a href="register.html" class="btn-register">📝 Зарегистрироваться</a>

    <p class="hint">
      Нет студенческого? Отправь фото — админ проверит.<br>
      <a href="admin.html">🛠 Админ-панель</a>
    </p>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
